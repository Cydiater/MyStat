name: MyStat-iOS
options:
  bundleIdPrefix: com.cydiater
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
    DEVELOPMENT_TEAM: VK379AZANR
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false

targets:
  MyStat-iOS:
    type: application
    platform: iOS
    sources:
      - path: MyStat-iOS
      - path: Shared
      - path: ../Sources/MyStatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cydiater.MyStat-iOS
        INFOPLIST_FILE: MyStat-iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyStat-iOS/MyStat-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: MyStatWidgetExtension

  MyStatWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MyStatWidget
      - path: Shared
      - path: ../Sources/MyStatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cydiater.MyStat-iOS.MyStatWidget
        INFOPLIST_FILE: MyStatWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyStatWidget/MyStatWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
